<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <!-- Ilustración: calle de barrio con un bache señalizado y una luminaria -->
  <rect width="480" height="360" rx="24" fill="#dbeafe"/>
  <!-- Edificios -->
  <rect x="40" y="90" width="90" height="150" rx="6" fill="#93c5fd"/>
  <rect x="145" y="60" width="80" height="180" rx="6" fill="#60a5fa"/>
  <rect x="345" y="100" width="95" height="140" rx="6" fill="#93c5fd"/>
  <g fill="#eff6ff">
    <rect x="58" y="110" width="18" height="18" rx="3"/><rect x="94" y="110" width="18" height="18" rx="3"/>
    <rect x="58" y="145" width="18" height="18" rx="3"/><rect x="94" y="145" width="18" height="18" rx="3"/>
    <rect x="160" y="80" width="18" height="18" rx="3"/><rect x="192" y="80" width="18" height="18" rx="3"/>
    <rect x="160" y="115" width="18" height="18" rx="3"/><rect x="192" y="115" width="18" height="18" rx="3"/>
    <rect x="362" y="120" width="18" height="18" rx="3"/><rect x="404" y="120" width="18" height="18" rx="3"/>
    <rect x="362" y="155" width="18" height="18" rx="3"/><rect x="404" y="155" width="18" height="18" rx="3"/>
  </g>
  <!-- Vereda y calle -->
  <rect x="0" y="240" width="480" height="20" fill="#cbd5e1"/>
  <rect x="0" y="260" width="480" height="100" fill="#475569"/>
  <g fill="#f8fafc"><rect x="20" y="305" width="50" height="8" rx="4"/><rect x="110" y="305" width="50" height="8" rx="4"/><rect x="320" y="305" width="50" height="8" rx="4"/><rect x="410" y="305" width="50" height="8" rx="4"/></g>
  <!-- Bache -->
  <ellipse cx="240" cy="312" rx="48" ry="16" fill="#1e293b"/>
  <!-- Cono de señalización -->
  <path d="M290 300 L306 248 L322 300 Z" fill="#f97316"/>
  <rect x="300" y="268" width="12" height="7" fill="#ffffff"/>
  <rect x="284" y="298" width="44" height="8" rx="3" fill="#ea580c"/>
  <!-- Luminaria apagada -->
  <rect x="262" y="110" width="6" height="132" fill="#334155"/>
  <path d="M265 112 Q265 96 290 96 L300 96" stroke="#334155" stroke-width="6" fill="none"/>
  <rect x="290" y="96" width="26" height="10" rx="4" fill="#94a3b8"/>
  <!-- Pin de reporte -->
  <path d="M240 150c-17 0-30 13-30 30 0 22 30 50 30 50s30-28 30-50c0-17-13-30-30-30z" fill="#f97316"/>
  <circle cx="240" cy="180" r="12" fill="#ffffff"/>
  <rect x="237.5" y="171" width="5" height="11" rx="2.5" fill="#1e3a5f"/>
  <circle cx="240" cy="187" r="2.5" fill="#1e3a5f"/>
